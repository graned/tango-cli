# Docker Hub workflow using tango.
#
# Required secrets:
#   DOCKERHUB_USERNAME
#   DOCKERHUB_TOKEN    — access token from hub.docker.com

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  TANGO_REGISTRY_HOST: docker.io
  TANGO_REGISTRY_NAMESPACE: ${{ secrets.DOCKERHUB_USERNAME }}
  TANGO_SHA: ${{ github.sha }}

jobs:
  publish:
    name: Publish image (PR)
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: dtolnay/rust-toolchain@stable
      - run: cargo install --path . --locked

      - name: Publish
        run: |
          tango publish \
            --package app \
            --event pr \
            --sha "$TANGO_SHA" \
            --pr "${{ github.event.number }}" \
            --json

  promote:
    name: Promote to main (merge)
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: dtolnay/rust-toolchain@stable
      - run: cargo install --path . --locked

      - name: Promote
        run: |
          tango promote \
            --package app \
            --sha "$TANGO_SHA" \
            --target-tag main \
            --target-tag latest \
            --json
