# Single-repo GitHub Actions workflow using tango.
#
# Flow:
#   PR    → build image, push sha-<sha> + pr-<n>
#   merge → promote sha-<sha> to main + latest (no rebuild)

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  TANGO_REGISTRY_HOST: ghcr.io
  TANGO_REGISTRY_NAMESPACE: ${{ github.repository_owner }}
  TANGO_SHA: ${{ github.sha }}

jobs:
  publish:
    name: Publish image (PR)
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: dtolnay/rust-toolchain@stable
      - run: cargo install --path . --locked

      - name: Publish
        run: |
          tango publish \
            --package app \
            --event pr \
            --sha "$TANGO_SHA" \
            --pr "${{ github.event.number }}" \
            --json

  promote:
    name: Promote to main (merge)
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: dtolnay/rust-toolchain@stable
      - run: cargo install --path . --locked

      - name: Promote
        run: |
          tango promote \
            --package app \
            --sha "$TANGO_SHA" \
            --target-tag main \
            --target-tag latest \
            --json
