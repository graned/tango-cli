# Monorepo GitHub Actions workflow using tango.
#
# Flow:
#   PR    → detect affected packages → build each in parallel
#   merge → promote each affected package (no rebuild)

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  TANGO_REGISTRY_HOST: ghcr.io
  TANGO_REGISTRY_NAMESPACE: ${{ github.repository_owner }}
  TANGO_SHA: ${{ github.sha }}

jobs:
  # Detect which packages changed so we only build what's needed.
  affected:
    name: Detect affected packages
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    outputs:
      packages: ${{ steps.detect.outputs.packages }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@stable
      - run: cargo install --path . --locked

      - name: Detect
        id: detect
        run: |
          PKGS=$(tango affected \
            --base "origin/${{ github.base_ref }}" \
            --head HEAD \
            --json | jq -c '.affected_packages')
          echo "packages=$PKGS" >> "$GITHUB_OUTPUT"
          echo "Affected: $PKGS"

  publish:
    name: Publish ${{ matrix.package }} (PR)
    runs-on: ubuntu-latest
    needs: affected
    if: needs.affected.outputs.packages != '[]'
    strategy:
      fail-fast: false
      matrix:
        package: ${{ fromJson(needs.affected.outputs.packages) }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: dtolnay/rust-toolchain@stable
      - run: cargo install --path . --locked

      - name: Publish
        run: |
          tango publish \
            --package "${{ matrix.package }}" \
            --event pr \
            --sha "$TANGO_SHA" \
            --pr "${{ github.event.number }}" \
            --json

  promote:
    name: Promote all packages (merge)
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: dtolnay/rust-toolchain@stable
      - run: cargo install --path . --locked

      # On merge we promote every package. Each promote is a single
      # imagetools create call — fast and cheap even for many packages.
      - name: Promote
        run: |
          for package in api worker frontend; do
            echo "--- promoting $package"
            tango promote \
              --package "$package" \
              --sha "$TANGO_SHA" \
              --target-tag main \
              --target-tag latest \
              --json
          done
