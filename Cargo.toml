[package]
name = "tango"
version = "0.1.0"
edition = "2021"
description = "Registry-agnostic artifact orchestration CLI for Docker/OCI images"
license = "MIT"

[[bin]]
name = "tango"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive", "env"] }
serde = { version = "1", features = ["derive"] }
serde_yaml = "0.9"
serde_json = "1"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.11", features = ["json", "rustls-tls"], default-features = false }
anyhow = "1"
thiserror = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
base64 = "0.21"
sha2 = "0.10"
async-trait = "0.1"
